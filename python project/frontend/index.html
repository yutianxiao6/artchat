<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流绘 · 对话与画布</title>
    <link rel="icon" type="image/png" href="/static/assets/favicon.png">
    <link rel="shortcut icon" href="/static/assets/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/workflow.css?v=20260515b" rel="stylesheet">
    <style>
        /* 全局CSS变量 - 统一高端深色主题规范 */
        :root {
            --primary-color: #165DFF;
            --primary-hover: #4080FF;
            --success-color: #00B42A;
            --danger-color: #F53F3F;
            --warning-color: #FF7D00;
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --bg-input: #334155;
            --bg-hover: #273449;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-disabled: #64748B;
            --border-color: #334155;
            --border-radius: 8px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --transition: all 0.2s ease;
        }

        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,.14), transparent 32%),
                radial-gradient(circle at top right, rgba(99,102,241,.12), transparent 30%),
                linear-gradient(180deg, #0b1120 0%, #0f172a 42%, #111827 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            line-height: 1.5;
        }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--bg-card); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--bg-input); border-radius: 3px; transition: var(--transition); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

        /* 标签页核心样式 */
        .tab-content { display: none; height: 100%; }
        .tab-content.active { display: block; }

        /* 顶部导航栏 */
        .header {
            position: relative;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing:.04em;
        }
        .header-logo img { width: 26px; height: 26px; border-radius: 6px; }
        .header-logo span {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-logo i {
            color: var(--primary-color);
            margin-right: 12px;
            font-size: 24px;
        }
        .tab-nav { display: flex; gap: 8px; }
        .header-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:var(--transition)}.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
        .tab-btn {
            padding: 8px 20px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { background-color: var(--bg-hover); color: var(--text-primary); }
        .tab-btn.active { background-color: var(--primary-color); color: #fff; }

        /* 主内容容器 */
        .main-container { height: calc(100vh - 64px); overflow: hidden; }

        /* 卡片通用样式 */
        .card {
            background: linear-gradient(180deg, rgba(30,41,59,.92), rgba(15,23,42,.92));
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,.12);
            box-shadow: 0 18px 48px rgba(2,6,23,.24);
            overflow: hidden;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 20px; }

        /* 表单通用样式 */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.2);
        }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-textarea.no-resize { resize: none; }

        /* 按钮通用样式 */
        .btn {
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary-color); color: #fff; }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success-color); color: #fff; }
        .btn-success:hover:not(:disabled) { background-color: #00C853; }
        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-danger:hover:not(:disabled) { background-color: #FF5252; }
        .btn-default { background-color: var(--bg-input); color: var(--text-primary); }
        .btn-default:hover:not(:disabled) { background-color: var(--bg-hover); }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

        /* 表格样式 */
        .table-container { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table thead { background-color: var(--bg-input); }
        .table th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .table tbody tr { border-bottom: 1px solid var(--border-color); transition: var(--transition); }
        .table tbody tr:hover { background-color: var(--bg-hover); }
        .table td { padding: 12px 16px; color: var(--text-secondary); }
        .table-action { display: flex; gap: 12px; justify-content: flex-end; }
        .table-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; transition: var(--transition); }
        .table-btn.edit { color: var(--primary-color); }
        .table-btn.edit:hover { color: var(--primary-hover); }
        .table-btn.delete { color: var(--danger-color); }
        .table-btn.delete:hover { color: #FF5252; }
        .empty-tip { padding: 40px 0; text-align: center; color: var(--text-disabled); }
        .empty-tip i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        /* 聊天界面样式 */
        .chat-header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px 24px; }
        .chat-header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }
        .chat-config-wrap { flex: 1; }
        .chat-messages { height: calc(100% - 180px); overflow-y: auto; padding: 24px; }
        .messages-container { max-width: 900px; margin: 0 auto; }
        .chat-message { margin-bottom: 24px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        .message-header.user { color: var(--primary-color); justify-content: flex-end; }
        .message-header.assistant { color: var(--success-color); }
        .message-content {
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 85%;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message-content.user {
            background-color: var(--primary-color);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .message-content.assistant {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }
        .chat-input-wrap { background-color: var(--bg-card); border-top: 1px solid var(--border-color); padding: 20px 24px; }
        .chat-input-container { max-width: 900px; margin: 0 auto; position: relative; }
        .chat-input {
            width: 100%;
            padding: 14px 100px 14px 18px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: var(--transition);
        }
        .chat-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.2); }
        .chat-send-btn { position: absolute; right: 12px; bottom: 12px; padding: 8px 20px; height: 38px; }
        .modal-mask{position:fixed;inset:0;background:rgba(2,6,23,.76);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}.modal-mask.active{display:flex}.modal-card{width:min(980px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;box-shadow:var(--shadow-md)}.modal-card .card{margin:0;box-shadow:none;border:none;background:transparent}.modal-stack{display:grid;gap:16px}

        /* 图片生成界面样式 */
        .image-toolbar { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px 24px; overflow-x: auto; }
        .toolbar-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .image-main { height: calc(100% - 80px); overflow-y: auto; padding: 24px; }
        .image-container { max-width: 1200px; margin: 0 auto; }
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background-color: var(--bg-card);
            margin-bottom: 20px;
            transition: var(--transition);
            cursor: pointer;
        }
        .upload-area:hover { border-color: var(--primary-color); }
        .upload-area.hidden { display: none; }
        .upload-preview img { max-height: 200px; border-radius: 8px; margin: 0 auto; }
        .custom-size-area { margin-bottom: 20px; display: none; }
        .custom-size-area.show { display: block; }
        .prompt-card { margin-bottom: 20px; }
        .generate-btn-wrap { text-align: center; margin-bottom: 32px; }
        .generate-btn { padding: 12px 40px; font-size: 16px; font-weight: 600; }
        .loading-tip { color: var(--text-secondary); margin-top: 12px; display: none; }
        .loading-tip.show { display: block; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
        .image-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .image-card img { width: 100%; height: auto; object-fit: contain; display: block; }
        .image-card-footer {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
        }
        .image-size { font-size: 13px; color: var(--text-secondary); }

        /* 响应式适配 */
        @media (max-width: 1024px) {
            .header{padding:0 16px}
            .chat-header-content{max-width:none;flex-wrap:wrap;align-items:stretch}
            .messages-container{max-width:none}
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .toolbar-grid { grid-template-columns: repeat(2, 1fr); }
            .image-grid { grid-template-columns: 1fr; }
            .tab-btn span { display: none; }
            .chat-header-content { flex-direction: column; align-items: stretch; }
            .header-logo{font-size:18px}.header-logo i{margin-right:8px;font-size:20px}
            .header{height:auto;min-height:64px;padding:10px 14px;gap:10px;flex-wrap:wrap}
            .tab-nav{order:3;width:100%;justify-content:flex-start;overflow:auto}
            .main-container{height:calc(100vh - 84px)}
            .modal-mask{padding:12px}
            .modal-card{width:100%;max-height:calc(100vh - 24px)}
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-logo">
            <img src="/static/assets/logo.png" alt="logo">
            <span>流绘</span>
        </div>
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="chat">
                <i class="fa fa-comments"></i>
                <span>聊天对话</span>
            </button>
            <button class="tab-btn" data-tab="image">
                <i class="fa fa-picture-o"></i>
                <span>无限画布</span>
            </button>
            <button class="tab-btn" data-tab="workflow">
                <i class="fa fa-film"></i>
                <span>工作流</span>
            </button>
        </nav>
        <div class="header-actions">
            <button class="icon-btn" id="open-config-modal-btn" title="配置">
                <i class="fa fa-cog"></i>
            </button>
        </div>
        <div style="position:absolute;right:12px;bottom:-14px;font-size:9px;color:rgba(148,163,184,.45);white-space:nowrap;pointer-events:none;">未经本人允许禁止二次分发 · 严禁转卖</div>
    </header>

    <!-- 主内容区 -->
    <main class="main-container">
        <!-- 1. 配置管理标签页 -->
        <div id="config" class="tab-content custom-scrollbar" style="display:none;">
            <div class="card" style="max-width: 1000px; margin: 24px auto;">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fa fa-wrench"></i>
                        模型配置管理
                    </h2>
                    <button class="btn btn-primary" id="new-config-btn">
                        <i class="fa fa-plus"></i>
                        新增配置
                    </button>
                </div>
                <div class="card-body">
                    <!-- 配置列表 -->
                    <div class="table-container">
                        <table class="table" id="config-table">
                            <thead>
                                <tr>
                                    <th>配置名称</th>
                                    <th>配置类型</th>
                                    <th>模型名称</th>
                                    <th style="text-align: right;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="config-list-body">
                                <tr>
                                    <td colspan="4">
                                        <div class="empty-tip" id="config-empty-tip">
                                            <i class="fa fa-folder-open-o"></i>
                                            <p>暂无配置，点击「新增配置」创建</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 配置编辑表单 -->
            <div class="card" style="max-width: 1000px; margin: 0 auto 24px;">
                <div class="card-header">
                    <h2 class="card-title" id="form-title">
                        <i class="fa fa-edit"></i>
                        新增配置
                    </h2>
                </div>
                <div class="card-body">
                    <input type="hidden" id="edit-config-id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">配置名称</label>
                            <input type="text" class="form-input" id="config-name" placeholder="例如：OpenAI-GPT4o">
                        </div>
                        <div class="form-group">
                            <label class="form-label">配置类型</label>
                            <select class="form-select" id="config-type">
                                <option value="chat">仅聊天模型</option>
                                <option value="image">仅图片模型</option>
                                <option value="both">聊天+图片通用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">API Base 地址</label>
                        <input type="text" class="form-input" id="api-base" placeholder="例如：https://api.openai.com/v1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">API Key 秘钥</label>
                        <input type="password" class="form-input" id="api-key" placeholder="输入你的API秘钥">
                    </div>
                    <div class="form-group">
                        <label class="form-label">模型名称</label>
                        <input type="text" class="form-input" id="model-name" placeholder="例如：gpt-4o、gpt-image-2、dall-e-3">
                    </div>
                    <div class="form-group">
                        <label class="form-label">配置描述（可选）</label>
                        <textarea class="form-textarea" id="config-desc" rows="2" placeholder="备注配置用途、限制等"></textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" id="test-config-btn">
                            <i class="fa fa-check"></i>
                            测试连接
                        </button>
                        <button class="btn btn-primary" id="save-config-btn">
                            <i class="fa fa-save"></i>
                            保存配置
                        </button>
                        <button class="btn btn-default" id="reset-form-btn">
                            <i class="fa fa-refresh"></i>
                            重置表单
                        </button>
                    </div>
                    <div id="test-result" style="margin-top: 12px; font-size: 14px;"></div>
                </div>
            </div>
        </div>

        <!-- 2. 聊天对话标签页 -->
        <div id="chat" class="tab-content">
            <div class="chat-header">
                <div class="chat-header-content">
                    <div class="chat-config-wrap">
                        <label class="form-label">选择聊天配置</label>
                        <select class="form-select" id="chat-config-select">
                            <option value="">请先在配置管理中创建聊天模型配置</option>
                        </select>
                    </div>
                    <div style="width: 120px;">
                        <label class="form-label">温度系数</label>
                        <input type="number" class="form-input" id="temperature" min="0" max="2" step="0.1" value="0.7">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px; min-width:180px;">
                        <label class="form-label">聊天附件</label>
                        <input type="file" class="form-input" id="chat-file-input" multiple accept=".txt,.md,.json,.csv,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.log,.ini,.cfg,.pdf,.doc,.docx">
                    </div>
                    <button class="btn btn-danger" id="clear-chat-btn">
                        <i class="fa fa-trash"></i>
                        清空对话
                    </button>
                </div>
            </div>

            <div class="chat-messages custom-scrollbar" id="chat-messages">
                <div class="messages-container" id="messages-container">
                    <div class="empty-tip" id="chat-empty-tip">
                        <i class="fa fa-comments-o"></i>
                        <p>选择配置后，开始对话吧</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrap">
                <div class="chat-input-container">
                    <textarea class="chat-input" id="chat-input" rows="3" placeholder="输入你的问题，Shift+Enter换行，Enter发送"></textarea>
                    <button class="btn btn-primary chat-send-btn" id="send-chat-btn" disabled>发送</button>
                </div>
            </div>
        </div>

        <!-- 3. 图片生成标签页 -->
        <div id="image" class="tab-content" style="height: calc(100vh - 64px); overflow: hidden;">
        </div>

        <div id="workflow" class="tab-content" style="height: calc(100vh - 64px); overflow: hidden;">
        </div>

        <div id="assets" class="tab-content custom-scrollbar">
            <div class="card" style="max-width: 1200px; margin: 24px auto;">
                <div class="card-header">
                    <h2 class="card-title"><i class="fa fa-folder-open-o"></i> 素材库</h2>
                </div>
                <div class="card-body">
                    <div id="assets-library-root"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-mask" id="config-modal">
        <div class="modal-card custom-scrollbar">
            <div class="card-header">
                <h2 class="card-title"><i class="fa fa-cog"></i> 配置管理</h2>
                <button class="btn btn-default" id="close-config-modal-btn">关闭</button>
            </div>
            <div class="card-body modal-stack">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><i class="fa fa-wrench"></i> 模型配置管理</h2>
                        <button class="btn btn-primary" id="new-config-btn-modal"><i class="fa fa-plus"></i> 新增配置</button>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="table" id="config-table-modal">
                                <thead><tr><th>配置名称</th><th>配置类型</th><th>模型名称</th><th style="text-align: right;">操作</th></tr></thead>
                                <tbody id="config-list-body-modal"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title" id="form-title-modal"><i class="fa fa-edit"></i> 新增配置</h2>
                    </div>
