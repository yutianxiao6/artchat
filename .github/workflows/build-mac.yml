name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - x86_64
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14

    defaults:
      run:
        working-directory: python project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if not requested
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.arch != 'both' && github.event.inputs.arch != matrix.arch
        run: |
          echo "用户只请求了 ${{ github.event.inputs.arch }}，跳过 ${{ matrix.arch }}"
          echo "SKIP_JOB=1" >> $GITHUB_ENV

      # ───────── arm64：原生构建 ─────────
      - name: Setup Python (arm64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (arm64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'arm64'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ───────── x86_64：通过 Rosetta 跨编译 ─────────
      - name: Install Rosetta (x86_64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Setup x86_64 Python via official installer
        if: env.SKIP_JOB != '1' && matrix.arch == 'x86_64'
        run: |
          curl -L -o /tmp/python-x86_64.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg /tmp/python-x86_64.pkg -target /
          PY_X86=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3
          echo "PY_X86=$PY_X86" >> $GITHUB_ENV
          arch -x86_64 "$PY_X86" -c "import platform; print('python arch =', platform.machine())"

      - name: Install deps (x86_64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'x86_64'
        run: |
          arch -x86_64 "$PY_X86" -m pip install --upgrade pip
          arch -x86_64 "$PY_X86" -m pip install -r requirements.txt

      - name: Install create-dmg
        if: env.SKIP_JOB != '1'
        run: brew install create-dmg

      # ───────── 打包 ─────────
      - name: Build .app + DMG (arm64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'arm64'
        env:
          TARGET_ARCH: arm64
        run: python3 build_mac.py

      - name: Build .app + DMG (x86_64)
        if: env.SKIP_JOB != '1' && matrix.arch == 'x86_64'
        env:
          TARGET_ARCH: x86_64
        run: arch -x86_64 "$PY_X86" build_mac.py

      - name: Rename artifacts with arch suffix
        if: env.SKIP_JOB != '1'
        run: |
          cd dist
          if [ -f "LiuHui.dmg" ]; then
            mv "LiuHui.dmg" "LiuHui-${{ matrix.arch }}.dmg"
          fi
          if [ -d "流绘.app" ]; then
            tar -czf "LiuHui-${{ matrix.arch }}.app.tar.gz" "流绘.app"
          fi
          ls -lh

      - name: Upload artifacts
        if: env.SKIP_JOB != '1'
        uses: actions/upload-artifact@v4
        with:
          name: LiuHui-macOS-${{ matrix.arch }}
          path: |
            python project/dist/LiuHui-${{ matrix.arch }}.dmg
            python project/dist/LiuHui-${{ matrix.arch }}.app.tar.gz
          if-no-files-found: warn

      - name: Attach to release
        if: env.SKIP_JOB != '1' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            python project/dist/LiuHui-${{ matrix.arch }}.dmg
            python project/dist/LiuHui-${{ matrix.arch }}.app.tar.gz
